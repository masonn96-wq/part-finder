<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Part Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-height 3D stage, slim job strip on top, part card docked at the bottom like a workshop label */
:root{
  --bg:#eef0f1; --stage:#e3e6e8; --card:#ffffff; --fg:#1d2226; --muted:#5d666d; --line:#cdd2d6;
  --hi:#f2600c; --hi-ink:#ffffff; --panel:#d9d4cc; --edge:#6f777d; --ghost:#9aa3a9;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191c; --stage:#1b2024; --card:#22282c; --fg:#e8ecee; --muted:#9aa4ab; --line:#343c42;
  --hi:#ff7a2e; --hi-ink:#1a0e05; --panel:#5b5852; --edge:#a7b0b6; --ghost:#58626a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191c; --stage:#1b2024; --card:#22282c; --fg:#e8ecee; --muted:#9aa4ab; --line:#343c42;
  --hi:#ff7a2e; --hi-ink:#1a0e05; --panel:#5b5852; --edge:#a7b0b6; --ghost:#58626a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
.strip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.strip b{color:var(--fg);font-weight:600}
#stage{flex:1;min-height:0;position:relative;background:var(--stage);touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.views{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.views button{font:500 13px var(--display);letter-spacing:.04em;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.views button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.views button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.card{background:var(--card);border-top:1px solid var(--line);padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.tag{grid-row:span 2;background:var(--hi);color:var(--hi-ink);font:600 13px var(--mono);border-radius:6px;padding:8px 10px;text-align:center;line-height:1.1}
.tag span{display:block;font-size:26px}
.name{font-size:24px;font-weight:700;line-height:1.1;text-wrap:balance;min-width:0}
.where{color:var(--muted);font-size:15px;min-width:0}
.specs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.specs b{color:var(--fg);font-weight:600}
.card.empty .tag{background:var(--line);color:var(--muted)}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);letter-spacing:.04em}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head><body>
<div class="strip"><span>Job <b id="job">385</b> · <span id="room">Room 1</span></span><span id="count"></span></div>
<div id="stage">
  <div class="views" role="group" aria-label="View">
    <button id="vCab" aria-pressed="true">Cabinet</button>
    <button id="vJob" aria-pressed="false">Whole job</button>
  </div>
  <div class="hint">Drag to turn · pinch to zoom · tap a panel</div>
</div>
<div class="card empty" id="card">
  <div class="tag">ID<span id="pid">–</span></div>
  <div class="name" id="pname">Scan a part label</div>
  <div class="where" id="pwhere">The part will light up in orange where it fits.</div>
  <div class="specs" id="pspecs"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const KEY = (Q.get('j') || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
fetch('jobs/' + encodeURIComponent(KEY) + '.json').then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(start).catch(() => { document.getElementById('pname').textContent = 'Job not found'; document.getElementById('pwhere').textContent = 'Rescan the label, or check the job has been uploaded.'; });
function start(JOB){
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const stage = $('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 10, 50000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(1500, 3000, 2500); scene.add(sun);

function geo(m){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(m.p, 3));
  g.setIndex(m.i); g.computeVertexNormals(); g.computeBoundingBox();
  return g;
}
const parts = JOB.parts.map(p => {
  const g = geo(p.mesh);
  const mat = new THREE.MeshLambertMaterial({transparent:true, side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
  const mesh = new THREE.Mesh(g, mat);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 25), new THREE.LineBasicMaterial({transparent:true}));
  mesh.userData.part = p; scene.add(mesh); scene.add(edges);
  return {p, mesh, edges, box:g.boundingBox};
});
const hardware = JOB.context.map(m => {
  const mesh = new THREE.Mesh(geo(m), new THREE.MeshLambertMaterial({transparent:true}));
  scene.add(mesh); return mesh;
});
const byId = new Map(parts.filter(x => x.p.id).map(x => [String(x.p.id), x]));
$('job').textContent = JOB.job;
$('count').textContent = byId.size + ' parts';

let sel = null, view = 'cab';

function paint(){
  const c = n => new THREE.Color(css(n));
  scene.background = c('--stage');
  const panel = c('--panel'), hi = c('--hi'), edge = c('--edge'), ghost = c('--ghost');
  for (const x of parts){
    const isSel = sel && x === sel;
    const sameCab = sel && x.p.cabNo && x.p.cabNo === sel.p.cabNo;
    const m = x.mesh.material, e = x.edges.material;
    if (!sel){ m.color.copy(panel); m.opacity = 1; e.color.copy(edge); e.opacity = .55; }
    else if (isSel){ m.color.copy(hi); m.opacity = 1; e.color.copy(hi).multiplyScalar(.6); e.opacity = 1; }
    else if (sameCab){ m.color.copy(panel); m.opacity = .28; e.color.copy(edge); e.opacity = .6; }
    else { m.color.copy(ghost); m.opacity = .07; e.color.copy(ghost); e.opacity = .18; }
    m.depthWrite = !sel || isSel;
    x.mesh.renderOrder = isSel ? 2 : 1;
  }
  for (const h of hardware){ h.material.color.copy(ghost); h.material.opacity = sel ? .15 : .6; h.material.depthWrite = !sel; }
}

function boxOf(list){ const b = new THREE.Box3(); list.forEach(x => b.union(x.box)); return b; }
function frame(box){
  const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.length() / 2, 250);
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
  const dist = r / Math.sin(Math.min(vf, hf)) * 1.02;
  const dir = new THREE.Vector3(-0.45, 0.42, 1).normalize();   // front, slightly left and above
  camera.position.copy(ctr).addScaledVector(dir, dist);
  controls.target.copy(ctr); controls.update();
}
function reframe(){
  if (view === 'job' || !sel) frame(boxOf(parts));
  else frame(boxOf(parts.filter(x => x.p.cabNo === sel.p.cabNo)));
}

function show(x){
  sel = x || null;
  const card = $('card');
  if (!sel){
    card.classList.add('empty'); $('pid').textContent = '–';
    $('pname').textContent = 'Scan a part label';
    $('pwhere').textContent = 'The part will light up in orange where it fits.';
    $('pspecs').innerHTML = '';
  } else {
    const p = sel.p;
    card.classList.remove('empty'); $('pid').textContent = p.id;
    $('pname').textContent = p.name;
    $('pwhere').textContent = 'Cab ' + p.cabNo + ' · ' + p.cabName;
    $('room').textContent = p.room || 'Room 1';
    const t = Number.isFinite(p.thick) ? Math.round(p.thick) : '';
    $('pspecs').innerHTML =
      '<span><b>' + Math.round(p.L) + ' × ' + Math.round(p.W) + (t ? ' × ' + t : '') + '</b> mm</span>' +
      '<span>' + esc(p.material || '') + '</span><span>' + esc(p.code) + '</span>';
  }
  paint(); reframe();
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function fromHash(){
  const h = (Q.get('p') || decodeURIComponent(location.hash.slice(1))).replace(/^p/i, '');
  show(h ? byId.get(h) : null);
  if (h && !byId.has(h)){ $('pname').textContent = 'Part ' + h + ' is not in job ' + JOB.job; $('pwhere').textContent = 'Check the job number on the label.'; }
}
addEventListener('hashchange', fromHash);

function setView(v){ view = v; $('vCab').setAttribute('aria-pressed', v === 'cab'); $('vJob').setAttribute('aria-pressed', v === 'job'); reframe(); }
$('vCab').onclick = () => setView('cab');
$('vJob').onclick = () => setView('job');

// tap a panel to identify it
const ray = new THREE.Raycaster(); let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera({x:(e.clientX - r.left) / r.width * 2 - 1, y:-(e.clientY - r.top) / r.height * 2 + 1}, camera);
  const hit = ray.intersectObjects(parts.map(x => x.mesh))[0];
  if (hit){ const x = parts.find(q => q.mesh === hit.object); if (x.p.id) { try { history.replaceState(null, '', '#p' + x.p.id); } catch (_) {} show(x); } }
});

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(() => { resize(); }).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
new MutationObserver(paint).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

resize(); fromHash();
(function loop(){ controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
}
</script>

</body></html>
