<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Part Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-height 3D stage, slim job strip on top, part card docked at the bottom like a workshop label */
:root{
  --bg:#eef0f1; --stage:#e3e6e8; --card:#ffffff; --fg:#1d2226; --muted:#5d666d; --line:#cdd2d6;
  --hi:#f2600c; --hi-ink:#ffffff; --panel:#d9d4cc; --edge:#6f777d; --ghost:#9aa3a9;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191c; --stage:#1b2024; --card:#22282c; --fg:#e8ecee; --muted:#9aa4ab; --line:#343c42;
  --hi:#ff7a2e; --hi-ink:#1a0e05; --panel:#5b5852; --edge:#a7b0b6; --ghost:#58626a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191c; --stage:#1b2024; --card:#22282c; --fg:#e8ecee; --muted:#9aa4ab; --line:#343c42;
  --hi:#ff7a2e; --hi-ink:#1a0e05; --panel:#5b5852; --edge:#a7b0b6; --ghost:#58626a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
.strip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.strip b{color:var(--fg);font-weight:600}
#stage{flex:1;min-height:0;position:relative;background:var(--stage);touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.views{position:absolute;top:12px;right:12px;left:12px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.views button{font:500 13px var(--display);letter-spacing:.04em;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.views button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.views button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.card{background:var(--card);border-top:1px solid var(--line);padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.tag{grid-row:span 2;background:var(--hi);color:var(--hi-ink);font:600 13px var(--mono);border-radius:6px;padding:8px 10px;text-align:center;line-height:1.1}
.tag span{display:block;font-size:26px}
.name{font-size:24px;font-weight:700;line-height:1.1;text-wrap:balance;min-width:0}
.where{color:var(--muted);font-size:15px;min-width:0}
.specs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.specs b{color:var(--fg);font-weight:600}
.card.empty .tag{background:var(--line);color:var(--muted)}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;max-height:58%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px 14px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:2;max-width:420px;margin-left:auto}
.sheethead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-10px;background:var(--card);padding:6px 0 8px;font-size:16px}
.sheethead button,.sheetbtns button{font:500 13px var(--display);padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.sheetbtns{display:flex;gap:8px;margin:4px 0 8px}
.fin{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.fin .sw{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);flex:none;background-size:cover}
.fin .tl{flex:1;min-width:0}
.fin select{font:500 13px var(--display);padding:5px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);max-width:46%}
.fin input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;flex:none}
.sheet h3{margin:12px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tog{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.tog input{width:20px;height:20px;accent-color:var(--hi);flex:none}
.tog .tl{flex:1;min-width:0}
.tog .ts{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.tog .ts b{color:var(--fg)}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.tip{position:absolute;left:12px;right:12px;bottom:12px;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:1;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.tip .tag{grid-row:span 2;padding:6px 8px}
.tip .tag span{font-size:20px}
.tip .name{font-size:19px}
.tip .where{font-size:13px}
.tip .x{grid-row:span 2;align-self:start;font:500 13px var(--display);padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.tip .specs{grid-column:1/-1;margin-top:6px;padding-top:8px}
.tip .note{grid-column:1/-1;margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--bg);font-size:14px;font-weight:600;border-left:3px solid var(--hi)}
/* homepage: every uploaded job */
.home{flex:1;min-height:0;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.home .in{max-width:720px;margin:0 auto}
.home h1{font-size:28px;line-height:1.1;margin:8px 0 2px;letter-spacing:-.01em}
.home .sub{color:var(--muted);font-size:15px;margin:0 0 14px}
.home input{width:100%;font:500 16px var(--display);padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin-bottom:12px}
.home input:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.jobs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.jobs a{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none;min-height:44px}
.jobs a:hover{border-color:var(--edge)}
.jobs a:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.jobs .no{grid-row:span 2;background:var(--hi);color:var(--hi-ink);font:600 14px var(--mono);border-radius:6px;padding:8px 8px;min-width:64px;text-align:center}
.jobs .no.none{background:var(--line);color:var(--muted)}
.jobs .nm{font-size:17px;font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.jobs .mt{color:var(--muted);font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.jobs .go{grid-row:span 2;color:var(--muted);font-size:22px}
.home .empty{color:var(--muted);padding:24px 4px;text-align:center}
.strip a{color:inherit;text-decoration:none}
.strip a:hover{color:var(--fg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head><body>
<div class="strip"><span><a href="./" title="All jobs">&lsaquo; Jobs</a> · Job <b id="job">–</b> · <span id="room">Room 1</span></span><span id="count"></span></div>
<main class="home" id="home" hidden>
  <div class="in">
    <h1>Part Finder</h1>
    <p class="sub">Pick a job to open its 3D model.</p>
    <input id="q" type="search" placeholder="Search job number, name or room" aria-label="Search jobs" autocomplete="off">
    <ul class="jobs" id="jobs"></ul>
    <p class="empty" id="jobsEmpty" hidden></p>
  </div>
</main>
<div id="stage">
  <div class="views" role="group" aria-label="View">
    <button id="vCab" aria-pressed="true">Cabinet</button>
    <button id="vJob" aria-pressed="false">Whole job</button>
    <button id="vSolid" aria-pressed="true" title="Show everything solid">Solid</button>
    <button id="vMulti" aria-pressed="false" title="Pick several cabinets to view together">Select cabs</button>
    <button id="vGo" hidden>Isolate</button>
    <button id="vSee" aria-pressed="false" hidden title="See-through view">See-through</button>
    <button id="vExplode" aria-pressed="false" hidden>Explode</button>
    <button id="vDims" aria-pressed="false" hidden title="Show the cabinet's width, height and depth">Dims</button>
    <button id="vPrev" hidden title="Previous cabinet">&lsaquo; Prev</button>
    <button id="vNext" hidden title="Next cabinet">Next &rsaquo;</button>
    <button id="vBack" hidden>Back to job</button>
    <button id="vLayers" aria-pressed="false" title="Show or hide cabinets, materials and parts">Show / hide</button>
  </div>
  <div class="hint" id="hint"></div>
  <section class="tip" id="tip" hidden aria-live="polite">
    <div class="tag">ID<span id="tid">–</span></div>
    <div class="name" id="tname"></div>
    <button type="button" class="x" id="tclose" aria-label="Close part info">Close</button>
    <div class="where" id="twhere"></div>
    <div class="specs" id="tspecs"></div>
    <div class="note" id="tnote" hidden></div>
  </section>
  <section class="sheet" id="sheet" hidden aria-label="Show or hide">
    <div class="sheethead"><b id="sheetTitle">Show / hide</b><button type="button" id="sheetClose" aria-label="Close">Done</button></div>
    <div id="sheetBody"></div>
  </section>
</div>
<div class="card empty" id="card">
  <div class="tag"><i id="ptag" style="font-style:normal">ID</i><span id="pid">–</span></div>
  <div class="name" id="pname">Scan a part label</div>
  <div class="where" id="pwhere">Scan a sticker to light up its part, or tap a cabinet to see its size.</div>
  <div class="specs" id="pspecs"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const RAWJ = (Q.get('j') || '').trim();
// Each CV job has its own page, keyed by its full job name ("J1093 - 62 Florizel St - Kitchen" ->
// j1093-62-florizel-st-kitchen), so separate CV jobs under one J number never overwrite each other.
// Older pages were keyed by the J number only, so that is tried second.
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const NUM = RAWJ.match(/(?:^|[^A-Za-z0-9])(J\d{3,})(?!\d)/i);
// ---- homepage: no job in the link -> list every uploaded job (jobs/index.json, kept by the sync)
async function home(filter){
  const $ = id => document.getElementById(id);
  document.title = 'Part Finder';
  $('stage').hidden = true; $('card').hidden = true; $('home').hidden = false;
  document.querySelector('.strip').innerHTML = '<span><b>Part Finder</b> · All jobs</span><span id="count"></span>';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let jobs = [];
  try { const r = await fetch('jobs/index.json', {cache: 'no-cache'}); if (r.ok) jobs = (await r.json()).jobs || []; } catch (_) {}
  $('count').textContent = jobs.length + (jobs.length === 1 ? ' job' : ' jobs');
  const draw = () => {
    const q = $('q').value.trim().toLowerCase();
    const list = jobs.filter(j => !q || [j.name, j.number, j.room].join(' ').toLowerCase().includes(q));
    $('jobs').innerHTML = list.map(j => {
      const meta = [j.room, j.cabs ? j.cabs + ' cabs' : '', j.parts ? j.parts + ' parts' : '', j.updated ? 'updated ' + j.updated : ''].filter(Boolean).join(' · ');
      return '<li><a href="?j=' + encodeURIComponent(j.key) + '"><span class="no' + (j.number ? '' : ' none') + '">' + esc(j.number || 'JOB') + '</span>' +
        '<span class="nm">' + esc(j.name) + '</span><span class="go" aria-hidden="true">&rsaquo;</span><span class="mt">' + esc(meta) + '</span></a></li>';
    }).join('');
    $('jobsEmpty').hidden = list.length > 0;
    $('jobsEmpty').textContent = !jobs.length ? 'No jobs uploaded yet. Jobs appear here after the sync publishes them.' : 'No job matches "' + $('q').value + '".';
  };
  $('q').addEventListener('input', draw);
  if (filter) $('q').value = filter;
  draw();
}
(async () => {
  if (!RAWJ) return home();
  const load = async k => { try { const r = await fetch('jobs/' + encodeURIComponent(k) + '.json'); if (r.ok) return await r.json(); } catch (_) {} return null; };
  // 1. the full CV job name (sticker QRs)
  let job = null;
  if (!(NUM && slug(RAWJ) === slug(NUM[1])) && (job = await load(slug(RAWJ)))) return start(job);
  // 2. just the job number (e.g. the QR on the shop drawings: ?j=J974): look it up in the job list. One CV job
  //    with that number opens straight away; several (kitchen, laundry...) show the list for that number.
  if (NUM){
    let jobs = [];
    try { const r = await fetch('jobs/index.json', {cache: 'no-cache'}); if (r.ok) jobs = (await r.json()).jobs || []; } catch (_) {}
    const hits = jobs.filter(j => (j.number || '').toUpperCase() === NUM[1].toUpperCase() && j.key !== slug(NUM[1]));
    if (hits.length === 1 && (job = await load(hits[0].key))) return start(job);
    if (hits.length > 1) return home(NUM[1].toUpperCase());
    // 3. last resort: an old page saved under the J number only
    if ((job = await load(slug(NUM[1])))) return start(job);
  }
  document.getElementById('pname').textContent = 'Job not found';
  document.getElementById('pwhere').innerHTML = 'Rescan the label, or <a href="./">pick the job from the list</a>.';
})();
function start(JOB){
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const stage = $('stage');
// logarithmic depth: phones have far less depth precision than desktops, which made hidden parts
// (hinges, back faces, edges) bleed through door faces
// phones: Safari closes the page if it uses too much memory, so phones get a lighter canvas and textures
const PHONE = matchMedia('(pointer: coarse)').matches || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const TEX_MAX = PHONE ? 1024 : 2048;
const renderer = new THREE.WebGLRenderer({antialias:true, logarithmicDepthBuffer:true, precision:'highp', powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio, PHONE ? 1.5 : 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 10, 50000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
// gentler than three.js defaults (all 1.0, damping 0.05): slower turn/zoom/pan with a short, soft glide
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.6;
controls.panSpeed = 0.6;
controls.screenSpacePanning = true;
// light mostly comes from the viewer (a lamp on the camera), so the faces you look at are the brightest and
// thin edges / route bevels turned toward a fixed sun don't glow white
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8178, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.15); sun.position.set(1500, 3000, 2500); scene.add(sun);
const headlamp = new THREE.DirectionalLight(0xffffff, 0.6); headlamp.position.set(0.3, 0.5, 1);
camera.add(headlamp); headlamp.target.position.set(0, 0, -1); camera.add(headlamp.target); scene.add(camera);

// ---- materials (v2 files carry real CV materials + textures; v1 files get plain board colour) ----
const loader = new THREE.TextureLoader();
const texCache = {}, texUsers = {}, texVariants = {};
// One GPU texture per image (plus one per different repeat). Cloning per mesh uploaded the same image
// hundreds of times - fine on a PC, but it ran phones out of graphics memory and crashed the page.
function textureAt(file, rx, ry){
  const base = texture(file);
  if (Math.abs(rx - 1) < 1e-6 && Math.abs(ry - 1) < 1e-6) return base;
  const key = file + '|' + rx.toFixed(5) + '|' + ry.toFixed(5);
  if (!texCache[key]){
    const v = base.clone(); v.repeat.set(rx, ry); v.needsUpdate = true;
    (texVariants[file] = texVariants[file] || []).push(v); texCache[key] = v;
  }
  return texCache[key];
}
function texture(file){
  if (!texCache[file]){
    texUsers[file] = [];
    const t = loader.load('textures/' + encodeURIComponent(file),
      img => {
        // shrink big pictures (a 1500 x 2500 board photo is ~20 MB on the graphics chip) - looks the same on screen
        const w = img.width, h = img.height, k = TEX_MAX / Math.max(w, h);
        if (k < 1){
          const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); t.image = c; t.needsUpdate = true;
        }
        (texVariants[file] || []).forEach(v => { v.image = t.image; v.needsUpdate = true; }); texUsers[file].forEach(m => { m.needsUpdate = true; }); },
      undefined,
      () => texUsers[file].forEach(m => { m.map = null; m.color.copy(m.userData.fallback); m.userData.base.copy(m.userData.fallback); m.needsUpdate = true; }));
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
    if ('encoding' in t) t.encoding = THREE.sRGBEncoding;
    texCache[file] = t;
  }
  return texCache[file];
}
const MATS = (JOB.materials || []).map(m => ({c: new THREE.Color(m.c[0], m.c[1], m.c[2]), t: m.t, s: m.s}));
function realMaterial(mi){
  const d = MATS[mi];
  const mat = new THREE.MeshLambertMaterial({side:THREE.DoubleSide, transparent:true, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
  if (d && d.t){
    // v2 UVs are already in real-size repeats; v1 needs the material's tile size
    const t = JOB.v >= 2 ? textureAt(d.t, 1, 1) : textureAt(d.t, 1 / (d.s[0] || 24), 1 / (d.s[1] || 24));
    mat.map = t; mat.color.set(0xffffff);
    mat.userData.fallback = d.c.clone();
    texUsers[d.t].push(mat);
  } else if (d) mat.color.copy(d.c);
  else mat.color.set(0xd9d4cc);
  mat.userData.base = mat.color.clone();
  if (!mat.userData.fallback) mat.userData.fallback = mat.color.clone();
  return mat;
}
renderer.outputEncoding = THREE.sRGBEncoding;

function geo(sub){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(sub.p, 3));
  if (sub.u && sub.u.length) g.setAttribute('uv', new THREE.Float32BufferAttribute(sub.u, 2));
  g.setIndex(sub.i); g.computeVertexNormals(); g.computeBoundingBox();
  return g;
}
// Outline edges: an edge is drawn when only one face uses it, or its faces meet at a real angle.
// Ignores zero-area slivers and flipped triangle winding, which otherwise draw stray diagonal lines.
function outline(g){
  const p = g.attributes.position.array, idx = g.index.array, edges = new Map(), out = [];
  const A = new THREE.Vector3(), B = new THREE.Vector3(), Cv = new THREE.Vector3(), n = new THREE.Vector3();
  const key = i => Math.round(p[i*3]) + ',' + Math.round(p[i*3+1]) + ',' + Math.round(p[i*3+2]);
  for (let t = 0; t < idx.length; t += 3){
    A.fromArray(p, idx[t]*3); B.fromArray(p, idx[t+1]*3); Cv.fromArray(p, idx[t+2]*3);
    n.subVectors(B, A).cross(Cv.clone().sub(A)); const len = n.length(); if (len < 1) continue; n.divideScalar(len);
    const v = [idx[t], idx[t+1], idx[t+2]];
    for (let k = 0; k < 3; k++){
      const i = v[k], j = v[(k+1) % 3], ki = key(i), kj = key(j); if (ki === kj) continue;
      const e = ki < kj ? ki + '|' + kj : kj + '|' + ki;
      if (!edges.has(e)) edges.set(e, {i, j, ns: []});
      edges.get(e).ns.push(n.clone());
    }
  }
  const cos = Math.cos(25 * Math.PI / 180);
  for (const {i, j, ns} of edges.values()){
    let draw = ns.length === 1;
    for (let a = 0; a < ns.length && !draw; a++) for (let b = a + 1; b < ns.length; b++) if (Math.abs(ns[a].dot(ns[b])) < cos){ draw = true; break; }
    if (draw) out.push(p[i*3], p[i*3+1], p[i*3+2], p[j*3], p[j*3+1], p[j*3+2]);
  }
  const eg = new THREE.BufferGeometry(); eg.setAttribute('position', new THREE.Float32BufferAttribute(out, 3)); return eg;
}
function makeObject(rec, isPart){
  const subs = rec.subs || [{m: -1, p: rec.mesh.p, i: rec.mesh.i}];
  const meshes = [], edges = [], box = new THREE.Box3();
  for (const s of subs){
    const g = geo(s);
    const mesh = new THREE.Mesh(g, realMaterial(s.m));
    mesh.userData.mi = s.m;
    if (isPart) mesh.userData.part = rec;
    scene.add(mesh); meshes.push(mesh); box.union(g.boundingBox);
    if (isPart || rec.r){
      let eg;
      if (s.e && s.e.length){ eg = new THREE.BufferGeometry(); eg.setAttribute('position', g.attributes.position); eg.setIndex(s.e); }
      else eg = outline(g);
      const e = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({transparent:true}));
      e.userData.mi = s.m;
      scene.add(e); edges.push(e); }
  }
  // the job file's number lists are now on the graphics chip: drop them so the phone isn't holding two copies
  if (rec.subs) for (const s of rec.subs){ s.p = s.u = s.i = s.e = null; }
  if (rec.mesh) rec.mesh = null;

const ray = new THREE.Raycaster(); let down = null, lastTap = null, tapTimer = null;
function pick(e){

// ---- dimensions: cabinet width above, height and depth on the side (CV's cabinet sizes) ----
function dimLabel(text){
  // drawing style: just the number, no box. A thin halo in the background colour keeps it readable
  // where it crosses a line or a cabinet.
  const font = '600 44px "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif';
  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  const tw = Math.ceil(m.measureText(text).width);
  const c = document.createElement('canvas'); c.width = tw + 16; c.height = 60;
  const g = c.getContext('2d');
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = 6; g.strokeStyle = css('--stage'); g.strokeText(text, c.width / 2, 32);
  g.fillStyle = css('--fg'); g.fillText(text, c.width / 2, 32);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: t, depthTest: false, depthWrite: false, sizeAttenuation: false, transparent: true}));
  sp.userData.aspect = c.width / c.height;
  sp.scale.set(0.024 * sp.userData.aspect, 0.024, 1); sp.renderOrder = 22;
  return sp;
}
function fmt(v){ return (Math.round(v * 10) / 10).toString(); }
function buildDims(){

  const group = new THREE.Group(), pts = [];
  // several cabinets: every width, but height and depth only once, on the right-most cabinet
  const gs = [...isoGs].filter(g => parts.some(x => x.p.g === g));
  let last = gs[0], best = -Infinity;
  if (gs.length > 1){
    const f0 = new THREE.Vector3(); for (const m of movers) if (!m.m.inner && isoGs.has(parts[m.m.f] && parts[m.m.f].p.g)) f0.add(m.n);
    f0.y = 0; if (f0.length() < 0.1) f0.set(0, 0, 1); f0.normalize();

new ResizeObserver(() => { resize(); }).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
new MutationObserver(paint).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

resize(); hintText(); fromHash(); $('vDims').setAttribute('aria-pressed', dimsOn); if (dimsOn) buildDims();
(function loop(t){
  if (sel) for (const m of sel.meshes) m.material.emissiveIntensity = still ? .35 : .2 + .25 * (1 + Math.sin((t || 0) / 300)) / 2;
  moveStep(); controls.update(); wallStep(); renderer.render(scene, camera); requestAnimationFrame(loop);
})();
}
