<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D View panel</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./keys.js"></script>
<script src="./match.js"></script>
<style>
  :root { color-scheme: light; --ink:#172b4d; --mute:#5e6c84; --line:#dfe1e6; --bg:#f4f5f7; --warn:#a54800; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 0 0 8px; min-height: 40px; }
  #job { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #note { color: var(--mute); white-space: nowrap; }
  #note.warn, #link.warn { color: var(--warn); white-space: normal; }
  #link { color: var(--mute); white-space: nowrap; }
  #allow { background: #0c66e4; border-color: #0c66e4; color: #fff; }
  #allow:hover { background: #0055cc; }
  .spacer { flex: 1; }
  #rooms { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  #rooms button[aria-pressed="true"] { background: #172b4d; border-color: #172b4d; color: #fff; }
  button { font: inherit; height: 32px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); padding: 0 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #ebecf0; }
  .stage { flex: 1; position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fafbfc; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .msg { padding: 24px; color: var(--mute); }
  .msg b { color: var(--ink); }
</style>
</head>
<body>
<div class="bar">
  <span id="job">Loading…</span>
  <span id="note"></span>
  <span id="rooms"></span>
  <span class="spacer"></span>
  <span id="link"></span>
  <button id="allow" type="button" hidden>Add phone link</button>
  <button id="change" type="button">Change job</button>
  <button id="full" type="button">Full screen</button>
</div>
<div class="stage" id="stage"><div class="msg">Loading…</div></div>

<script>
// Board id comes in the query string so the key is known before the client is created.
var APP_KEY = (typeof PFKeys !== "undefined") ? PFKeys.appKeyFor(new URLSearchParams(location.search).get("b") || "")
  : "704e82fa29aaf32f15335d5d929c6b9b";
try { console.log("[PF3D] panel v6", "keys:" + (typeof PFKeys), "match:" + (typeof PFMatch)); } catch (e) {}
var t = TrelloPowerUp.iframe({ appKey: APP_KEY, appName: "Part Finder 3D" });
var API = "https://api.trello.com/1";
var ctx = {}; try { ctx = t.getContext() || {}; } catch (e) {}
var cardId = ctx.card || "";
var cardName = t.arg("cardName") || "";
var VIEWER = new URL("../", location.href);
var INDEX = new URL("../jobs/index.json", location.href);
var $ = function (id) { return document.getElementById(id); };
var jobs = null, shownKey = null, pinned = "", linkedFor = null, linking = false, roomJobs = [];

function note(text, warn) { $("note").textContent = text || ""; $("note").className = warn ? "warn" : ""; }
function linkNote(text, warn) { $("link").textContent = text || ""; $("link").className = warn ? "warn" : ""; }
function rest() { return Promise.resolve(t.getRestApi()); }

// Keep one tappable link in the card description so the phone app can open the
// viewer (phone apps don't show this panel). Re-reads the description right
// before writing and only touches its own line.
function syncLink(list) {
  var want = list.map(function (j) { return j.key; }).join("|");
  if (!cardId || linking || linkedFor === want) return Promise.resolve();
  linking = true;
  var api;
  return rest().then(function (a) { api = a; return api.isAuthorized(); })
    .then(function (ok) {
      if (!ok) { $("allow").hidden = false; linkNote(""); return; }
      $("allow").hidden = true;
      return Promise.resolve(api.getToken()).then(function (tok) {
        var q = "key=" + APP_KEY + "&token=" + encodeURIComponent(tok);
        return fetch(API + "/cards/" + cardId + "?fields=desc&" + q)
          .then(function (r) { return r.ok ? r.json() : r.text().then(function (b) { throw restError(r.status, b); }); })
          .then(function (c) {
            var next = PFMatch.withLinks(c.desc || "", list, VIEWER.href);
            if (next === null) throw new Error("description is full");
            if (next === (c.desc || "")) { linkedFor = want; linkNote(list.length > 1 ? "Phone links ✓" : "Phone link ✓"); return; }
            return fetch(API + "/cards/" + cardId + "?" + q, {
              method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ desc: next }),
            }).then(function (r) {
              if (!r.ok) return r.text().then(function (b) { throw restError(r.status, b); });
              linkedFor = want; linkNote(list.length > 1 ? "Phone links added ✓" : "Phone link added ✓");
            });
          });
      });
    })
    .catch(function (e) {
      if (e.badToken && api) { Promise.resolve(api.clearToken()).catch(function () {}); $("allow").hidden = false; linkNote(""); return; }
      linkNote("Phone link not added: " + e.message, true);
    })
    .then(function () { linking = false; });
}
// Trello answers 400 "invalid token" for a bad or revoked token, 401 for no access.
function restError(status, body) {
  var e = new Error(status === 401 ? "no permission to edit this card" : (body || ("Trello answered " + status)).slice(0, 80));
  e.badToken = status === 400 && /token/i.test(body || "") || status === 401 && /token/i.test(body || "");
  return e;
}

$("allow").addEventListener("click", function () {
  rest().then(function (a) { return a.authorize({ scope: "read,write", expiration: "never" }); })
    .then(function () { linkedFor = null; return refresh(); })
    .catch(function (e) { linkNote("Not allowed: " + ((e && e.message) || e), true); });
});

// One button per model when a card covers several rooms of a job.
function drawRooms(list) {
  roomJobs = list;
  var box = $("rooms"); box.innerHTML = "";
  if (list.length < 2) return;
  list.forEach(function (j) {
    var b = document.createElement("button"); b.type = "button";
    b.textContent = j.room || j.name; b.dataset.key = j.key;
    b.setAttribute("aria-pressed", String(j.key === shownKey));
    b.addEventListener("click", function () { show(j); markRoom(); });
    box.appendChild(b);
  });
}
function markRoom() {
  [].forEach.call($("rooms").children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.key === shownKey)); });
}

function message(html) { shownKey = null; $("stage").innerHTML = '<div class="msg">' + html + "</div>"; }

function loadJobs() {
  if (jobs) return Promise.resolve(jobs);
  INDEX.searchParams.set("t", Date.now());
  return fetch(INDEX.href, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("jobs/index.json answered " + r.status); return r.json(); })
    .then(function (d) { jobs = (d && d.jobs) || []; return jobs; });
}

function show(job) {
  $("job").textContent = job.name + (job.room ? " · " + job.room : "");
  if (shownKey === job.key) return;              // never reload the 3D under someone's hand
  shownKey = job.key;
  var url = new URL(VIEWER); url.searchParams.set("j", job.key);
  $("stage").innerHTML = "";
  var f = document.createElement("iframe");
  f.title = "3D viewer"; f.setAttribute("allow", "fullscreen"); f.src = url.href;
  $("stage").appendChild(f);
}

// Re-runs whenever this card's plugin data changes (e.g. a job picked in the
// full-screen window), so the panel follows the choice without a refresh.
function refresh() {
  return Promise.all([loadJobs(), t.get(cardId, "shared", "pfJob").catch(function () { return ""; })])
    .then(function (r) {
      pinned = r[1] || "";
      var res = PFMatch.resolve(cardName, r[0], pinned);
      if (res.pinMissing) note("Saved job no longer in jobs/ — using the name match.", true);
      else note(res.reason === "pinned" ? "Chosen for this card" : res.reason === "rooms" ? res.jobs.length + " rooms" : res.reason === "number" ? "Matched by job number" : res.job ? "Matched by name" : "");
      if (res.job) {
        var keep = res.jobs.filter(function (j) { return j.key === shownKey; })[0];   // stay on the room being looked at
        show(keep || res.job); drawRooms(res.jobs); markRoom(); syncLink(res.jobs);
      }
      else { $("job").textContent = cardName || "This card"; drawRooms([]);
        message("<b>No job for this card.</b><br>Use <b>Change job</b> to pick one."); }
    })
    .catch(function (e) {
      $("job").textContent = cardName || "This card"; note("");
      message("<b>Couldn't load the job list.</b><br>" + e.message);
    });
}

function openModal() {
  return t.modal({
    url: "./viewer.html",
    args: { cardId: cardId, cardName: cardName, pinned: pinned },
    fullscreen: true,
    title: "3D View",
  }).catch(function (e) { note("Couldn't open: " + e.message, true); });
}
$("full").addEventListener("click", openModal);
$("change").addEventListener("click", openModal);

t.render(refresh);
</script>
</body>
</html>
